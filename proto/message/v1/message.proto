edition = "2023";

package message.v1;

import "media/v1/media.proto";
import "user/v1/user.proto";

// MessageService manages messages within a channel.
// Channels and threads are owned by the guild service; this service
// receives only channel_id as an opaque reference.
service MessageService {
  // Message
  // CreateMessage stores one message authored by an authenticated user.
  rpc CreateMessage(CreateMessageRequest) returns (CreateMessageResponse);
  // UpdateMessage edits present fields of one message.
  rpc UpdateMessage(UpdateMessageRequest) returns (UpdateMessageResponse);
  // DeleteMessage soft-deletes one message.
  rpc DeleteMessage(DeleteMessageRequest) returns (DeleteMessageResponse);
  // GetMessage returns one message after checking the caller's visibility.
  rpc GetMessage(GetMessageRequest) returns (GetMessageResponse);
  // ListMessages returns messages in a channel ordered by id descending
  // (newest first). Uses cursor-based pagination.
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse);
  // CreateAttachmentUpload authorizes the target channel and delegates a
  // single-PUT upload session to Media.
  rpc CreateAttachmentUpload(CreateAttachmentUploadRequest) returns (CreateAttachmentUploadResponse);
  // CompleteAttachmentUpload publishes an owned upload and returns trusted
  // Media metadata for a subsequent message write.
  rpc CompleteAttachmentUpload(CompleteAttachmentUploadRequest) returns (CompleteAttachmentUploadResponse);
  // AbortAttachmentUpload cancels an unpublished upload owned by the actor.
  rpc AbortAttachmentUpload(AbortAttachmentUploadRequest) returns (AbortAttachmentUploadResponse);
  // CreateDmChannel opens (or idempotently returns) the 1:1 channel between
  // two friends.
  rpc CreateDmChannel(CreateDmChannelRequest) returns (CreateDmChannelResponse);
  // ListDmChannels pages one user's 1:1 channels.
  rpc ListDmChannels(ListDmChannelsRequest) returns (ListDmChannelsResponse);
  // AckMessage moves the last-read position forward for one channel.
  rpc AckMessage(AckMessageRequest) returns (AckMessageResponse);
  // GetUserReadyState returns all DM channels and read states needed by READY.
  rpc GetUserReadyState(GetUserReadyStateRequest) returns (GetUserReadyStateResponse);
  // GetReadStates reconciles either one Guild or all DMs.
  rpc GetReadStates(GetReadStatesRequest) returns (GetReadStatesResponse);
}

// DmChannel is a private 1:1 conversation. Participants are stored in
// ascending user ID order.
message DmChannel {
  int64 id = 1;
  int64 user_lo = 2;
  int64 user_hi = 3;
  int64 created_at = 4;
}

// ============================================================
// Enums
// ============================================================

// MessageType distinguishes user messages from system messages and replies.
enum MessageType {
  // Zero value, not used in requests.
  MESSAGE_TYPE_UNSPECIFIED = 0;
  // A regular message.
  MESSAGE_TYPE_DEFAULT = 1;
  // A reply to another message. referenced_message_id must be set.
  MESSAGE_TYPE_REPLY = 19;
  // The first message of a thread, auto-generated when a thread is created.
  MESSAGE_TYPE_THREAD_STARTER = 21;
}

// MessageFlag is a bitmask applied to Message.flags.
enum MessageFlag {
  // Zero value, not used in requests.
  MESSAGE_FLAG_UNSPECIFIED = 0;
  // This message has an associated thread (thread id == message id).
  MESSAGE_FLAG_HAS_THREAD = 32;
  // Do not send push or desktop notifications for this message.
  MESSAGE_FLAG_SUPPRESS_NOTIFICATIONS = 4096;
}

// ============================================================
// Shared objects
// ============================================================

// Message represents a single message in a channel or thread.
message Message {
  reserved 3;
  reserved author;

  int64 id = 1;
  // Opaque reference to the channel or thread this message belongs to.
  int64 channel_id = 2;
  // Message body text. May be empty for attachment-only messages.
  string content = 4;

  MessageType type = 5;
  // Bitmask of MessageFlag values.
  int32 flags = 6;

  // ---- Reply / Forward ----
  // ID of the message being replied to or forwarded.
  int64 referenced_message_id = 7;
  // Channel of the referenced message. May differ from channel_id for
  // cross-channel forwards.
  int64 referenced_channel_id = 8;

  // Immutable media assets attached to this message.
  repeated Attachment attachments = 9;

  // Non-zero if the message has been edited (Unix milliseconds).
  int64 edited_at = 10;
  int64 created_at = 11;
  int64 updated_at = 12;
  // Monotonically increasing state version. Starts at 1 and increments on
  // every update and deletion.
  int64 revision = 13;
  // Stable reference to the user who sent this message.
  int64 author_id = 14;

  // User IDs parsed from mentions in content, in ascending user ID order.
  repeated int64 mention_user_ids = 15;
  // Role IDs parsed from mentions in content, in ascending role ID order.
  repeated int64 mention_role_ids = 16;
  // Whether the content mentions @everyone.
  bool mention_everyone = 17;
}

// Attachment describes a validated Media asset attached to a message.
message Attachment {
  // Stable Media asset ID. Message persists this ID rather than an object key
  // or URL.
  int64 asset_id = 1;
  // Original filename shown to users. Values supplied on message writes are
  // ignored and replaced from Media metadata.
  string filename = 2;
  // File size in bytes.
  int64 size = 3;
  // MIME type (e.g., "image/png").
  string content_type = 4;
  // Image dimensions, 0 if not applicable.
  int32 width = 5;
  int32 height = 6;
  // Complete public or presigned download URL.
  string url = 7;
  // Zero for public URLs; presigned URL expiration as Unix milliseconds.
  int64 url_expires_at = 8;
  // Compact image placeholder from Media. Empty for non-image attachments or
  // when Media did not generate one. Values supplied on message writes are
  // ignored and replaced from Media metadata.
  string blurhash = 9;
}

// CreateAttachmentUploadRequest carries an authenticated actor, target channel,
// and exact object upload contract to Media.
message CreateAttachmentUploadRequest {
  int64 channel_id = 1;
  // actor_user_id is derived from verified authentication state by the API
  // service.
  int64 actor_user_id = 2;
  // Exact Content-Length in bytes for the subsequent PUT.
  int64 expected_size = 3;
  // Canonical media type sent unchanged as the PUT Content-Type.
  string content_type = 4;
  // Original filename displayed to users and used as the safe object-key
  // suffix.
  string filename = 5;
  // Optional opaque key identifying one client-side attachment upload intent.
  // Retrying with the same key returns the same upload.
  string idempotency_key = 6;
}

// CreateAttachmentUploadResponse forwards Media's direct-upload contract.
message CreateAttachmentUploadResponse {
  // Opaque upload identifier used for completion or abort. It becomes the
  // stable asset ID after successful completion.
  int64 upload_id = 1;
  // Short-lived URL accepting one PUT with the declared length and media type.
  string presigned_url = 2;
  // Presigned URL expiration as Unix milliseconds.
  int64 expires_at = 3;
  // HTTP headers required by the presigned PUT. Browser-managed headers such
  // as Content-Length are informational and must not be set explicitly.
  map<string, string> request_headers = 4;
  // status is the Media upload lifecycle state observed for this response.
  media.v1.AssetStatus status = 5;
  // True when the existing idempotency record was replayed.
  bool idempotent_replay = 6;
}

// CompleteAttachmentUploadRequest publishes one channel-scoped upload.
message CompleteAttachmentUploadRequest {
  int64 channel_id = 1;
  // actor_user_id must be the user that created the upload.
  int64 actor_user_id = 2;
  // upload_id is the opaque value returned by CreateAttachmentUpload.
  int64 upload_id = 3;
}

// CompleteAttachmentUploadResponse contains trusted metadata suitable for a
// subsequent CreateMessage or UpdateMessage request.
message CompleteAttachmentUploadResponse {
  Attachment attachment = 1;
}

// AbortAttachmentUploadRequest cancels an unpublished channel-scoped upload.
message AbortAttachmentUploadRequest {
  int64 channel_id = 1;
  // actor_user_id must be the user that created the upload.
  int64 actor_user_id = 2;
  // upload_id is the opaque value returned by CreateAttachmentUpload.
  int64 upload_id = 3;
}

// AbortAttachmentUploadResponse is empty because abort has no mutable result.
message AbortAttachmentUploadResponse {}

// AttachmentList is used on updates to distinguish "leave unchanged" from
// "replace with an empty attachment list".
message AttachmentList {
  // Complete set of attachments that should remain on the message after edit.
  repeated Attachment attachments = 1;
}

// ============================================================
// Message RPCs
// ============================================================

// CreateMessageRequest stores one message in a channel or thread.
message CreateMessageRequest {
  // Opaque reference to the channel or thread.
  int64 channel_id = 1;
  // User authoring the message.
  int64 author_id = 2;
  // Message body text. May be empty for attachment-only messages.
  string content = 3;
  // Semantic kind of the message.
  MessageType type = 4;
  // Initial editable flags, such as MESSAGE_FLAG_SUPPRESS_NOTIFICATIONS.
  int32 flags = 5;

  // Set when type is MESSAGE_TYPE_REPLY.
  int64 referenced_message_id = 6;
  // Channel of the referenced message. Required when referenced_message_id is set.
  int64 referenced_channel_id = 7;

  // Complete attachment list carried with the message.
  repeated Attachment attachments = 8;

  reserved 9;
  // Optional opaque key identifying one client-side message creation intent.
  string idempotency_key = 10;
}

// CreateMessageResponse returns the stored message.
message CreateMessageResponse {
  Message message = 1;
  // Profile already loaded for the created event and reusable by API callers.
  user.v1.UserProfile author = 2;
}

// UpdateMessageRequest edits present fields of one message.
message UpdateMessageRequest {
  // Message to edit.
  int64 message_id = 1;
  // If present, replaces message content. An explicit empty string clears it.
  string content = 2;
  // User performing the edit. The service uses this for ownership checks and audit.
  int64 actor_user_id = 3;
  // If present, replaces editable flags. Include all flags that should remain set.
  int32 flags = 4;
  // If present, replaces the attachment list with this complete list.
  AttachmentList attachments = 5;
  reserved 6;
}

// UpdateMessageResponse returns the updated message.
message UpdateMessageResponse {
  Message message = 1;
  // Profile already loaded for the updated event and reusable by API callers.
  user.v1.UserProfile author = 2;
}

// DeleteMessageRequest soft-deletes one message.
message DeleteMessageRequest {
  // Message to delete.
  int64 message_id = 1;
  // User performing the delete. May differ from author_id for moderation actions.
  int64 actor_user_id = 2;
}

// DeleteMessageResponse confirms deletion.
message DeleteMessageResponse {
  bool ok = 1;
}

// GetMessageRequest fetches one message for one user.
message GetMessageRequest {
  // Message to fetch.
  int64 message_id = 1;
  // User whose visibility is checked.
  int64 user_id = 2;
}

// GetMessageResponse returns the message and its author profile.
message GetMessageResponse {
  Message message = 1;
  user.v1.UserProfile author = 2;
}

// ListMessagesRequest pages one channel's messages newest first.
message ListMessagesRequest {
  // Channel whose messages are listed.
  int64 channel_id = 1;
  // Cursor-based pagination. before, after, and around are mutually exclusive.
  oneof cursor {
    // Return messages before this message ID.
    int64 before = 2;
    // Return messages after this message ID.
    int64 after = 3;
    // Return messages around this message ID.
    int64 around = 4;
  }
  // Maximum results per page. Default 50, max 100.
  int32 limit = 5;
  // User whose visibility is checked.
  int64 user_id = 6;
}

// ListMessagesResponse returns a page of messages.
message ListMessagesResponse {
  repeated Message messages = 1;
  // The smallest message id in this page. Use as ListMessagesRequest.before
  // to fetch older messages. 0 means this page is empty.
  int64 before_cursor = 2;
  // The largest message id in this page. Use as ListMessagesRequest.after
  // to fetch newer messages. 0 means this page is empty.
  int64 after_cursor = 3;
}

// CreateDmChannelRequest opens the 1:1 channel between two friends.
message CreateDmChannelRequest {
  // User opening the channel.
  int64 user_id = 1;
  // Other participant.
  int64 target_id = 2;
}

// CreateDmChannelResponse returns the existing or newly created channel.
message CreateDmChannelResponse {
  DmChannel channel = 1;
}

// ListDmChannelsRequest pages one user's 1:1 channels.
message ListDmChannelsRequest {
  // User whose channels are listed.
  int64 user_id = 1;
  // Opaque continuation from ListDmChannelsResponse.next_cursor.
  // Omit (unset) to start from the first page. Pass the value through
  // unchanged; do not parse it.
  string cursor = 2;
  // Maximum results per page. Zero uses the default of 50; maximum is 100.
  int32 limit = 3;
}

// ListDmChannelsResponse returns a page of 1:1 channels.
message ListDmChannelsResponse {
  repeated DmChannel channels = 1;
  // Opaque cursor for the next page. Leave unset when there is no next
  // page; do not set an empty string. Pass through unchanged as the next
  // request's cursor. End of list is field absence (Go: !HasNextCursor();
  // TypeScript: undefined / omitted from JSON, not null).
  string next_cursor = 2;
}

// AckMessageRequest moves one user's read cursor forward in one channel.
message AckMessageRequest {
  // User whose read state is updated.
  int64 user_id = 1;
  // Channel whose read state is updated.
  int64 channel_id = 2;
  // Only a larger ID moves the cursor forward; smaller values are safe
  // no-ops so concurrent acks cannot un-read messages.
  int64 message_id = 3;
}

// AckMessageResponse returns the updated read state.
message AckMessageResponse {
  ChannelReadState read_state = 1;
}

// GetUserReadyStateRequest collects the DM and read-state data for READY.
message GetUserReadyStateRequest {
  // User whose state is loaded.
  int64 user_id = 1;
  // Server-authoritative visible Guild text channel IDs loaded by Session.
  repeated int64 guild_channel_ids = 2;
}

// ChannelReadState is one user's read position relative to a channel head.
message ChannelReadState {
  // Channel of the read state.
  int64 channel_id = 1;
  // Newest message ID currently in the channel.
  int64 last_message_id = 2;
  // Newest message ID the user has read.
  int64 last_read_message_id = 3;
  // Unread mentions in the channel.
  int32 mention_count = 4;
}

// GetUserReadyStateResponse returns the DM channels and read states for READY.
message GetUserReadyStateResponse {
  repeated DmChannel dm_channels = 1;
  repeated ChannelReadState read_states = 2;
}

// ReadStateScopeType selects which channels a read-state request covers.
enum ReadStateScopeType {
  // Zero value; invalid for requests.
  READ_STATE_SCOPE_TYPE_UNSPECIFIED = 0;
  // One Guild's channels.
  READ_STATE_SCOPE_TYPE_GUILD = 1;
  // Every 1:1 channel of the user.
  READ_STATE_SCOPE_TYPE_ALL_DMS = 2;
}

// GetReadStatesRequest reconciles read state for one scope.
message GetReadStatesRequest {
  // User whose read state is reconciled.
  int64 user_id = 1;
  // Scope of the reconciliation.
  ReadStateScopeType scope = 2;
  // Required only for READ_STATE_SCOPE_TYPE_GUILD.
  int64 guild_id = 3;
}

// GetReadStatesResponse returns the DM channels and per-channel read states.
message GetReadStatesResponse {
  // Present for the ALL_DMS scope so missed DM creation events are reconciled.
  repeated DmChannel dm_channels = 1;
  repeated ChannelReadState read_states = 2;
}
