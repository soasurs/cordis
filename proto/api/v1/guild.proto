edition = "2023";

package api.v1;

import "api/v1/media.proto";
import "api/v1/user.proto";

// ============================================================
// Enums
// ============================================================

// GuildPermission values are bit flags combined in uint64 permission fields.
enum GuildPermission {
  // No permission. Requests requiring a concrete permission reject this value.
  GUILD_PERMISSION_UNSPECIFIED = 0;
  // Grants every Guild permission and bypasses channel overwrites.
  GUILD_PERMISSION_ADMINISTRATOR = 1;
  GUILD_PERMISSION_MANAGE_GUILD = 2;
  GUILD_PERMISSION_MANAGE_ROLES = 4;
  GUILD_PERMISSION_MANAGE_MEMBERS = 8;
  GUILD_PERMISSION_KICK_MEMBERS = 16;
  GUILD_PERMISSION_VIEW_CHANNEL = 32;
  GUILD_PERMISSION_SEND_MESSAGES = 64;
  GUILD_PERMISSION_MANAGE_CHANNELS = 128;
  GUILD_PERMISSION_MANAGE_MESSAGES = 256;
  GUILD_PERMISSION_BAN_MEMBERS = 512;
  GUILD_PERMISSION_CREATE_INVITE = 1024;
}

// GuildChannelType identifies the behavior and nesting rules of a channel.
enum GuildChannelType {
  // No channel type. This value is invalid when creating a channel.
  GUILD_CHANNEL_TYPE_UNSPECIFIED = 0;
  // A channel that stores messages.
  GUILD_CHANNEL_TYPE_TEXT = 1;
  // A container for non-category channels.
  GUILD_CHANNEL_TYPE_CATEGORY = 2;
  // A realtime voice channel.
  GUILD_CHANNEL_TYPE_VOICE = 3;
}

// GuildPermissionOverwriteType selects whether an overwrite applies to a role
// or one member.
enum GuildPermissionOverwriteType {
  // No applies_to. This value is invalid in overwrite requests.
  GUILD_PERMISSION_OVERWRITE_TYPE_UNSPECIFIED = 0;
  GUILD_PERMISSION_OVERWRITE_TYPE_ROLE = 1;
  GUILD_PERMISSION_OVERWRITE_TYPE_MEMBER = 2;
}

// GuildService exposes authenticated guild metadata operations.
service GuildService {
  // Guild lifecycle.
  rpc CreateGuild(CreateGuildRequest) returns (CreateGuildResponse);
  rpc GetGuild(GetGuildRequest) returns (GetGuildResponse);
  // ListGuilds returns Guilds joined by the bearer token user.
  rpc ListGuilds(ListGuildsRequest) returns (ListGuildsResponse);
  rpc UpdateGuild(UpdateGuildRequest) returns (UpdateGuildResponse);
  // CreateGuildIconUpload creates a single-PUT icon upload after checking the
  // bearer token user's MANAGE_GUILD permission.
  rpc CreateGuildIconUpload(CreateGuildIconUploadRequest) returns (CreateGuildIconUploadResponse);
  // CompleteGuildIconUpload validates the image and replaces the Guild icon.
  rpc CompleteGuildIconUpload(CompleteGuildIconUploadRequest) returns (CompleteGuildIconUploadResponse);
  // AbortGuildIconUpload cancels an unpublished icon upload.
  rpc AbortGuildIconUpload(AbortGuildIconUploadRequest) returns (AbortGuildIconUploadResponse);
  rpc DeleteGuild(DeleteGuildRequest) returns (DeleteGuildResponse);

  // Membership and moderation.
  rpc AddGuildMember(AddGuildMemberRequest) returns (AddGuildMemberResponse);
  rpc GetGuildMember(GetGuildMemberRequest) returns (GetGuildMemberResponse);
  rpc ListGuildMembers(ListGuildMembersRequest) returns (ListGuildMembersResponse);
  rpc UpdateCurrentGuildMember(UpdateCurrentGuildMemberRequest) returns (UpdateCurrentGuildMemberResponse);
  rpc KickGuildMember(KickGuildMemberRequest) returns (KickGuildMemberResponse);
  rpc BanGuildMember(BanGuildMemberRequest) returns (BanGuildMemberResponse);
  rpc UnbanGuildMember(UnbanGuildMemberRequest) returns (UnbanGuildMemberResponse);
  rpc ListGuildBans(ListGuildBansRequest) returns (ListGuildBansResponse);
  rpc LeaveGuild(LeaveGuildRequest) returns (LeaveGuildResponse);
  rpc TransferGuildOwnership(TransferGuildOwnershipRequest) returns (TransferGuildOwnershipResponse);

  // Invites.
  rpc CreateGuildInvite(CreateGuildInviteRequest) returns (CreateGuildInviteResponse);
  // GetGuildInvite returns a public preview and does not require membership.
  rpc GetGuildInvite(GetGuildInviteRequest) returns (GetGuildInviteResponse);
  rpc ListGuildInvites(ListGuildInvitesRequest) returns (ListGuildInvitesResponse);
  rpc DeleteGuildInvite(DeleteGuildInviteRequest) returns (DeleteGuildInviteResponse);
  rpc JoinGuildByInvite(JoinGuildByInviteRequest) returns (JoinGuildByInviteResponse);

  // Roles and effective Guild permissions.
  rpc CreateGuildRole(CreateGuildRoleRequest) returns (CreateGuildRoleResponse);
  rpc GetGuildRole(GetGuildRoleRequest) returns (GetGuildRoleResponse);
  rpc ListGuildRoles(ListGuildRolesRequest) returns (ListGuildRolesResponse);
  rpc UpdateGuildRole(UpdateGuildRoleRequest) returns (UpdateGuildRoleResponse);
  // DeleteGuildRole rejects the default @everyone role.
  rpc DeleteGuildRole(DeleteGuildRoleRequest) returns (DeleteGuildRoleResponse);
  rpc ReorderGuildRoles(ReorderGuildRolesRequest) returns (ReorderGuildRolesResponse);
  rpc AddGuildMemberRole(AddGuildMemberRoleRequest) returns (AddGuildMemberRoleResponse);
  rpc RemoveGuildMemberRole(RemoveGuildMemberRoleRequest) returns (RemoveGuildMemberRoleResponse);
  // AddGuildRoleMembers assigns one non-default role to many members.
  rpc AddGuildRoleMembers(AddGuildRoleMembersRequest) returns (AddGuildRoleMembersResponse);
  // RemoveGuildRoleMembers removes one non-default role from many members.
  rpc RemoveGuildRoleMembers(RemoveGuildRoleMembersRequest) returns (RemoveGuildRoleMembersResponse);
  // ListGuildMemberRoles includes the implicit default role.
  rpc ListGuildMemberRoles(ListGuildMemberRolesRequest) returns (ListGuildMemberRolesResponse);
  // ListGuildRoleMembers returns explicitly assigned members, or every member
  // when role_id identifies the default role.
  rpc ListGuildRoleMembers(ListGuildRoleMembersRequest) returns (ListGuildRoleMembersResponse);
  rpc GetGuildMemberPermissions(GetGuildMemberPermissionsRequest) returns (GetGuildMemberPermissionsResponse);

  // Channels and permission overwrites.
  rpc CreateGuildChannel(CreateGuildChannelRequest) returns (CreateGuildChannelResponse);
  rpc GetGuildChannel(GetGuildChannelRequest) returns (GetGuildChannelResponse);
  rpc ListGuildChannels(ListGuildChannelsRequest) returns (ListGuildChannelsResponse);
  rpc UpdateGuildChannel(UpdateGuildChannelRequest) returns (UpdateGuildChannelResponse);
  rpc DeleteGuildChannel(DeleteGuildChannelRequest) returns (DeleteGuildChannelResponse);
  rpc ReorderGuildChannels(ReorderGuildChannelsRequest) returns (ReorderGuildChannelsResponse);
  rpc UpsertGuildChannelPermissionOverwrite(UpsertGuildChannelPermissionOverwriteRequest) returns (UpsertGuildChannelPermissionOverwriteResponse);
  // DeleteGuildChannelPermissionOverwrite rejects the default @everyone overwrite.
  rpc DeleteGuildChannelPermissionOverwrite(DeleteGuildChannelPermissionOverwriteRequest) returns (DeleteGuildChannelPermissionOverwriteResponse);
  rpc ListGuildChannelPermissionOverwrites(ListGuildChannelPermissionOverwritesRequest) returns (ListGuildChannelPermissionOverwritesResponse);
}

// ============================================================
// Shared resources
// ============================================================

// Guild is a community the authenticated user belongs to.
// All timestamps are Unix time in milliseconds.
message Guild {
  int64 id = 1;
  int64 owner_id = 2;
  string name = 3;
  // Zero means the Guild has no icon. Clients resolve a non-zero value through
  // the public CDN path icons/{id}/{icon_asset_id}.
  int64 icon_asset_id = 4;
  // Monotonically increasing resource version used to discard stale events.
  int64 revision = 5;
  int64 created_at = 6;
  int64 updated_at = 7;
  // Optional Guild description. Empty means no description.
  string description = 8;
}

// GuildMember is a user's membership in one guild.
// All timestamps are Unix time in milliseconds.
message GuildMember {
  int64 guild_id = 1;
  int64 user_id = 2;
  string nickname = 3;
  // Monotonically increasing membership version.
  int64 revision = 4;
  int64 joined_at = 5;
  int64 updated_at = 6;
  // Current public profile of this member.
  UserProfile profile = 7;
}

// GuildBan records an active Guild ban and the moderator who created it.
// created_at is Unix time in milliseconds.
message GuildBan {
  int64 guild_id = 1;
  int64 user_id = 2;
  int64 actor_user_id = 3;
  string reason = 4;
  int64 created_at = 5;
  // Current public profile of the banned user.
  UserProfile profile = 6;
  // Current public profile of the moderator who created the ban.
  UserProfile actor_profile = 7;
}

// GuildRole grants guild-level permissions to assigned members.
// All timestamps are Unix time in milliseconds.
message GuildRole {
  int64 id = 1;
  int64 guild_id = 2;
  string name = 3;
  uint64 permissions = 4;
  // Higher values have greater authority. The default role is always at zero.
  int32 position = 5;
  // The default role has the same ID as its Guild and applies implicitly to
  // every active member.
  bool is_default = 6;
  // Monotonically increasing resource version.
  int64 revision = 7;
  int64 created_at = 8;
  int64 updated_at = 9;
}

// GuildChannel is a text, category, or voice channel within one Guild.
// All timestamps are Unix time in milliseconds.
message GuildChannel {
  int64 id = 1;
  int64 guild_id = 2;
  string name = 3;
  GuildChannelType type = 4;
  int32 position = 5;
  string topic = 6;
  // Monotonically increasing resource version.
  int64 revision = 7;
  int64 created_at = 8;
  int64 updated_at = 9;
  // Parent category ID, or zero when the channel is at the Guild root.
  int64 parent_id = 10;
}

// GuildChannelPermissionOverwrite adjusts a role or member's permissions in a
// channel. Evaluation applies the default role, assigned roles, then the member.
message GuildChannelPermissionOverwrite {
  int64 channel_id = 1;
  int64 guild_id = 2;
  // Whether this overwrite applies to a role or a member.
  GuildPermissionOverwriteType applies_to = 3;
  // Role ID or user ID according to applies_to.
  int64 applies_to_id = 4;
  // Permission bits granted in this channel.
  uint64 allow = 5;
  // Permission bits denied in this channel.
  uint64 deny = 6;
  // Monotonically increasing resource version.
  int64 revision = 7;
  int64 created_at = 8;
  int64 updated_at = 9;
}

// ============================================================
// Guild lifecycle RPCs
// ============================================================

message CreateGuildRequest {
  string name = 1;
  // Optional opaque key identifying one client-side Guild creation intent.
  string idempotency_key = 2;
}

message CreateGuildResponse {
  Guild guild = 1;
}

message GetGuildRequest {
  int64 guild_id = 1;
}

message GetGuildResponse {
  Guild guild = 1;
}

message ListGuildsRequest {
  // Opaque continuation from ListGuildsResponse.next_cursor.
  // Omit (unset) to start from the first page. Pass the value through
  // unchanged; do not parse it.
  string cursor = 1;
  // Maximum results per page. Zero uses the default of 50; maximum is 100.
  int32 limit = 2;
}

message ListGuildsResponse {
  repeated Guild guilds = 1;
  // Opaque cursor for the next page. Leave unset when there is no next
  // page; do not set an empty string. Pass through unchanged as the next
  // request's cursor. End of list is field absence (Go: !HasNextCursor();
  // TypeScript: undefined / omitted from JSON, not null).
  string next_cursor = 2;
}

message UpdateGuildRequest {
  int64 guild_id = 1;
  // Optional replacement name.
  string name = 2;
  // Optional replacement description. Set to empty to clear it.
  string description = 3;
}

message UpdateGuildResponse {
  Guild guild = 1;
}

// CreateGuildIconUploadRequest declares the target Guild and exact image the
// client will upload.
message CreateGuildIconUploadRequest {
  int64 guild_id = 1;
  // Exact Content-Length in bytes for the subsequent PUT.
  int64 expected_size = 2;
  // Canonical image/jpeg, image/png, or image/webp media type. The same value
  // must be sent as the PUT Content-Type.
  string content_type = 3;
  // Optional opaque key identifying one client-side Guild icon upload intent.
  // Retrying with the same key returns the same upload.
  string idempotency_key = 4;
}

// CreateGuildIconUploadResponse contains a one-shot direct-upload contract.
message CreateGuildIconUploadResponse {
  // Opaque upload identifier used by completion or abort.
  int64 upload_id = 1;
  // Short-lived URL accepting one PUT with the declared length and media type.
  string presigned_url = 2;
  // Presigned URL expiration as Unix milliseconds.
  int64 expires_at = 3;
  // HTTP headers required by the presigned PUT. Browser-managed headers such
  // as Content-Length are informational and must not be set explicitly.
  map<string, string> request_headers = 4;
  // status is the upload lifecycle state observed for this response.
  UploadStatus status = 5;
  // True when the existing idempotency record was replayed.
  bool idempotent_replay = 6;
}

// CompleteGuildIconUploadRequest selects an icon upload for one Guild.
message CompleteGuildIconUploadRequest {
  int64 guild_id = 1;
  // Opaque value returned by CreateGuildIconUpload.
  int64 upload_id = 2;
}

// CompleteGuildIconUploadResponse returns the Guild after its icon reference
// has been replaced.
message CompleteGuildIconUploadResponse {
  Guild guild = 1;
}

// AbortGuildIconUploadRequest selects an unpublished icon upload to cancel.
message AbortGuildIconUploadRequest {
  int64 guild_id = 1;
  // Opaque value returned by CreateGuildIconUpload.
  int64 upload_id = 2;
}

// AbortGuildIconUploadResponse is empty because abort has no mutable result.
message AbortGuildIconUploadResponse {}

message DeleteGuildRequest {
  int64 guild_id = 1;
}

message DeleteGuildResponse {
  bool ok = 1;
}

// ============================================================
// Membership and moderation RPCs
// ============================================================

message AddGuildMemberRequest {
  int64 guild_id = 1;
  int64 user_id = 2;
}

message AddGuildMemberResponse {
  GuildMember member = 1;
}

message GetGuildMemberRequest {
  int64 guild_id = 1;
  int64 user_id = 2;
}

message GetGuildMemberResponse {
  GuildMember member = 1;
}

message ListGuildMembersRequest {
  int64 guild_id = 1;
  // Opaque continuation from ListGuildMembersResponse.next_cursor.
  // Omit (unset) to start from the first page. Pass the value through
  // unchanged; do not parse it.
  string cursor = 2;
  // Maximum results per page. Zero uses the default of 50; maximum is 100.
  int32 limit = 3;
}

message ListGuildMembersResponse {
  repeated GuildMember members = 1;
  // Opaque cursor for the next page. Leave unset when there is no next
  // page; do not set an empty string. Pass through unchanged as the next
  // request's cursor. End of list is field absence (Go: !HasNextCursor();
  // TypeScript: undefined / omitted from JSON, not null).
  string next_cursor = 2;
}

message UpdateCurrentGuildMemberRequest {
  int64 guild_id = 1;
  // Replaces the caller's guild nickname. An empty value clears it.
  string nickname = 2;
}

message UpdateCurrentGuildMemberResponse {
  GuildMember member = 1;
}

message KickGuildMemberRequest {
  int64 guild_id = 1;
  int64 user_id = 2;
}

message KickGuildMemberResponse {
  bool ok = 1;
}

message BanGuildMemberRequest {
  int64 guild_id = 1;
  int64 user_id = 2;
  string reason = 3;
}

message BanGuildMemberResponse {
  GuildBan ban = 1;
}

message UnbanGuildMemberRequest {
  int64 guild_id = 1;
  int64 user_id = 2;
}

message UnbanGuildMemberResponse {
  bool ok = 1;
}

message ListGuildBansRequest {
  int64 guild_id = 1;
  // Opaque continuation from ListGuildBansResponse.next_cursor.
  // Omit (unset) to start from the first page. Pass the value through
  // unchanged; do not parse it.
  string cursor = 2;
  // Maximum results per page. Zero uses the default of 50; maximum is 100.
  int32 limit = 3;
}

message ListGuildBansResponse {
  repeated GuildBan bans = 1;
  // Opaque cursor for the next page. Leave unset when there is no next
  // page; do not set an empty string. Pass through unchanged as the next
  // request's cursor. End of list is field absence (Go: !HasNextCursor();
  // TypeScript: undefined / omitted from JSON, not null).
  string next_cursor = 2;
}

message LeaveGuildRequest {
  int64 guild_id = 1;
}

message LeaveGuildResponse {
  bool ok = 1;
}

message TransferGuildOwnershipRequest {
  int64 guild_id = 1;
  int64 new_owner_id = 2;
}

message TransferGuildOwnershipResponse {
  Guild guild = 1;
}

// ============================================================
// Invite RPCs
// ============================================================

// GuildInvite is a shareable code that lets users join a guild.
// All timestamps are Unix time in milliseconds.
message GuildInvite {
  int64 id = 1;
  string code = 2;
  int64 guild_id = 3;
  int64 creator_user_id = 4;
  // Zero means unlimited uses.
  int32 max_uses = 5;
  int32 uses = 6;
  // Zero means the invite never expires.
  int64 expires_at = 7;
  int64 created_at = 8;
  // Current public profile of the member who created this invite.
  UserProfile creator = 9;
}

// GuildInvitePreview is the guild summary shown to a user before joining.
message GuildInvitePreview {
  string code = 1;
  int64 guild_id = 2;
  string guild_name = 3;
  // Zero means the Guild has no icon. Clients use
  // icons/{guild_id}/{guild_icon_asset_id} for a non-zero value.
  int64 guild_icon_asset_id = 4;
  int64 member_count = 5;
  int64 expires_at = 6;
  // Optional description of the Guild being previewed.
  string guild_description = 7;
}

message CreateGuildInviteRequest {
  int64 guild_id = 1;
  // Zero means unlimited uses.
  int32 max_uses = 2;
  // Relative lifetime in milliseconds. Zero means the invite never expires.
  int64 expires_in_ms = 3;
  // Optional opaque key identifying one client-side invite creation intent.
  string idempotency_key = 4;
}

message CreateGuildInviteResponse {
  GuildInvite invite = 1;
}

message GetGuildInviteRequest {
  string code = 1;
}

message GetGuildInviteResponse {
  GuildInvitePreview preview = 1;
}

message ListGuildInvitesRequest {
  int64 guild_id = 1;
  // Opaque continuation from ListGuildInvitesResponse.next_cursor.
  // Omit (unset) to start from the first page. Pass the value through
  // unchanged; do not parse it.
  string cursor = 2;
  // Maximum results per page. Zero uses the default of 50; maximum is 100.
  int32 limit = 3;
}

message ListGuildInvitesResponse {
  repeated GuildInvite invites = 1;
  // Opaque cursor for the next page. Leave unset when there is no next
  // page; do not set an empty string. Pass through unchanged as the next
  // request's cursor. End of list is field absence (Go: !HasNextCursor();
  // TypeScript: undefined / omitted from JSON, not null).
  string next_cursor = 2;
}

message DeleteGuildInviteRequest {
  string code = 1;
}

message DeleteGuildInviteResponse {
  bool ok = 1;
}

message JoinGuildByInviteRequest {
  string code = 1;
}

message JoinGuildByInviteResponse {
  Guild guild = 1;
  GuildMember member = 2;
}

// ============================================================
// Role RPCs
// ============================================================

message CreateGuildRoleRequest {
  int64 guild_id = 1;
  string name = 2;
  // Bitwise OR of GuildPermission values. The caller may grant only
  // permissions they hold.
  uint64 permissions = 3;
  // Optional opaque key identifying one client-side role creation intent.
  string idempotency_key = 4;
}

message CreateGuildRoleResponse {
  GuildRole role = 1;
}

message GetGuildRoleRequest {
  int64 guild_id = 1;
  int64 role_id = 2;
}

message GetGuildRoleResponse {
  GuildRole role = 1;
}

message ListGuildRolesRequest {
  int64 guild_id = 1;
}

message ListGuildRolesResponse {
  // Roles ordered by descending position, then ascending ID.
  repeated GuildRole roles = 1;
}

message UpdateGuildRoleRequest {
  int64 guild_id = 1;
  int64 role_id = 2;
  // Optional replacement fields. At least one must be present.
  string name = 3;
  uint64 permissions = 4;
}

message UpdateGuildRoleResponse {
  GuildRole role = 1;
}

message DeleteGuildRoleRequest {
  int64 guild_id = 1;
  int64 role_id = 2;
}

message DeleteGuildRoleResponse {
  bool ok = 1;
}

message GuildRolePosition {
  int64 role_id = 1;
  // Positive position for a non-default role. Higher values have greater
  // authority.
  int32 position = 2;
}

message ReorderGuildRolesRequest {
  int64 guild_id = 1;
  // Partial set of roles to move. Final positions must remain unique.
  repeated GuildRolePosition positions = 2;
}

message ReorderGuildRolesResponse {
  repeated GuildRole roles = 1;
}

message AddGuildMemberRoleRequest {
  int64 guild_id = 1;
  int64 user_id = 2;
  int64 role_id = 3;
}

message AddGuildMemberRoleResponse {
  bool ok = 1;
}

message RemoveGuildMemberRoleRequest {
  int64 guild_id = 1;
  int64 user_id = 2;
  int64 role_id = 3;
}

message RemoveGuildMemberRoleResponse {
  bool ok = 1;
}

message AddGuildRoleMembersRequest {
  int64 guild_id = 1;
  int64 role_id = 2;
  // Distinct positive member user IDs. At most 100 values.
  repeated int64 user_ids = 3;
}

message AddGuildRoleMembersResponse {
  bool ok = 1;
}

message RemoveGuildRoleMembersRequest {
  int64 guild_id = 1;
  int64 role_id = 2;
  // Distinct positive member user IDs. At most 100 values.
  repeated int64 user_ids = 3;
}

message RemoveGuildRoleMembersResponse {
  bool ok = 1;
}

message ListGuildMemberRolesRequest {
  int64 guild_id = 1;
  int64 user_id = 2;
}

message ListGuildMemberRolesResponse {
  // Roles ordered by descending position, including the default role.
  repeated GuildRole roles = 1;
}

message ListGuildRoleMembersRequest {
  int64 guild_id = 1;
  // The default role matches every active Guild member; other roles match
  // explicit assignments only.
  int64 role_id = 2;
  // Opaque continuation from ListGuildRoleMembersResponse.next_cursor.
  // Omit (unset) to start from the first page. Pass the value through
  // unchanged; do not parse it.
  string cursor = 3;
  // Maximum results per page. Zero uses the default of 50; maximum is 100.
  int32 limit = 4;
}

message ListGuildRoleMembersResponse {
  repeated GuildMember members = 1;
  // Opaque cursor for the next page. Leave unset when there is no next
  // page; do not set an empty string. Pass through unchanged as the next
  // request's cursor. End of list is field absence (Go: !HasNextCursor();
  // TypeScript: undefined / omitted from JSON, not null).
  string next_cursor = 2;
}

message GetGuildMemberPermissionsRequest {
  int64 guild_id = 1;
  int64 user_id = 2;
}

message GetGuildMemberPermissionsResponse {
  // Effective Guild-level permissions after combining ownership, the default
  // role, and explicit member roles. Channel overwrites are not applied.
  uint64 permissions = 1;
}

// ============================================================
// Channel and permission overwrite RPCs
// ============================================================

message CreateGuildChannelRequest {
  int64 guild_id = 1;
  string name = 2;
  GuildChannelType type = 3;
  string topic = 4;
  // Parent category ID, or zero to create the channel at the Guild root.
  int64 parent_id = 5;
  // Expected Guild channel layout revision from the caller's snapshot.
  int64 expected_channel_layout_revision = 6;
  // Optional opaque key identifying one client-side channel creation intent.
  string idempotency_key = 7;
}

message CreateGuildChannelResponse {
  GuildChannel channel = 1;
  int64 channel_layout_revision = 2;
}

message GetGuildChannelRequest {
  int64 channel_id = 1;
}

message GetGuildChannelResponse {
  GuildChannel channel = 1;
}

message ListGuildChannelsRequest {
  int64 guild_id = 1;
}

message ListGuildChannelsResponse {
  repeated GuildChannel channels = 1;
  // Revision of the complete Guild channel layout represented by this list.
  int64 channel_layout_revision = 2;
}

message UpdateGuildChannelRequest {
  int64 channel_id = 1;
  // Optional replacement fields. At least one must be present.
  string name = 2;
  string topic = 3;
  // Zero moves the channel to the Guild root. Omission preserves its parent.
  int64 parent_id = 4;
  // Required when parent_id is present.
  int64 expected_channel_layout_revision = 5;
}

message UpdateGuildChannelResponse {
  GuildChannel channel = 1;
  int64 channel_layout_revision = 2;
}

message DeleteGuildChannelRequest {
  int64 channel_id = 1;
  // Expected Guild channel layout revision from the caller's snapshot.
  int64 expected_channel_layout_revision = 2;
}

message DeleteGuildChannelResponse {
  bool ok = 1;
  int64 channel_layout_revision = 2;
}

message GuildChannelPosition {
  int64 channel_id = 1;
  // Zero-based position within the current or requested parent.
  int32 position = 2;
  // parent_id moves the channel to a category; zero moves it to the Guild root.
  // When omitted, the current parent is preserved.
  int64 parent_id = 3;
}

message ReorderGuildChannelsRequest {
  int64 guild_id = 1;
  // Partial set of channels to move. Final positions must remain unique
  // within each parent.
  repeated GuildChannelPosition positions = 2;
  // Expected Guild channel layout revision from the caller's snapshot.
  int64 expected_channel_layout_revision = 3;
}

message ReorderGuildChannelsResponse {
  repeated GuildChannel channels = 1;
  int64 channel_layout_revision = 2;
}

message UpsertGuildChannelPermissionOverwriteRequest {
  int64 channel_id = 1;
  GuildPermissionOverwriteType applies_to = 2;
  // Role ID or user ID according to applies_to.
  int64 applies_to_id = 3;
  // Permission bits to grant and deny. The same bit cannot appear in both.
  uint64 allow = 4;
  uint64 deny = 5;
}

message UpsertGuildChannelPermissionOverwriteResponse {
  GuildChannelPermissionOverwrite overwrite = 1;
}

message DeleteGuildChannelPermissionOverwriteRequest {
  int64 channel_id = 1;
  GuildPermissionOverwriteType applies_to = 2;
  int64 applies_to_id = 3;
}

message DeleteGuildChannelPermissionOverwriteResponse {
  bool ok = 1;
}

message ListGuildChannelPermissionOverwritesRequest {
  int64 channel_id = 1;
}

