edition = "2023";

package api.v1;

import "api/v1/common.proto";
import "api/v1/media.proto";

// CreateGuildRequest creates a Guild owned by the authenticated user.
message CreateGuildRequest {
  // Display name of the new Guild.
  string name = 1;
  // Optional opaque key identifying one client-side Guild creation intent.
  string idempotency_key = 2;
}

// CreateGuildResponse returns the created Guild.
message CreateGuildResponse {
  Guild guild = 1;
}

// GetGuildRequest fetches one Guild joined by the authenticated user.
message GetGuildRequest {
  // ID of the Guild to fetch.
  int64 guild_id = 1;
}

// GetGuildResponse returns the requested Guild.
message GetGuildResponse {
  Guild guild = 1;
}

// ListGuildsRequest pages the Guilds joined by the authenticated user.
message ListGuildsRequest {
  // Opaque continuation from ListGuildsResponse.next_cursor.
  // Omit (unset) to start from the first page. Pass the value through
  // unchanged; do not parse it.
  string cursor = 1;
  // Maximum results per page. Zero uses the default of 50; maximum is 100.
  int32 limit = 2;
}

// ListGuildsResponse returns a page of Guilds.
message ListGuildsResponse {
  repeated Guild guilds = 1;
  // Opaque cursor for the next page. Leave unset when there is no next
  // page; do not set an empty string. Pass through unchanged as the next
  // request's cursor. End of list is field absence (Go: !HasNextCursor();
  // TypeScript: undefined / omitted from JSON, not null).
  string next_cursor = 2;
}

// UpdateGuildRequest applies present name or description changes to one
// Guild.
message UpdateGuildRequest {
  // ID of the Guild to update.
  int64 guild_id = 1;
  // Optional replacement name.
  string name = 2;
  // Optional replacement description. Set to empty to clear it.
  string description = 3;
}

// UpdateGuildResponse returns the updated Guild.
message UpdateGuildResponse {
  Guild guild = 1;
}

// CreateGuildIconUploadRequest declares the target Guild and exact image the
// client will upload.
message CreateGuildIconUploadRequest {
  int64 guild_id = 1;
  // Exact Content-Length in bytes for the subsequent PUT.
  int64 expected_size = 2;
  // Canonical image/jpeg, image/png, or image/webp media type. The same value
  // must be sent as the PUT Content-Type.
  string content_type = 3;
  // Optional opaque key identifying one client-side Guild icon upload intent.
  // Retrying with the same key returns the same upload.
  string idempotency_key = 4;
}

// CreateGuildIconUploadResponse contains a one-shot direct-upload contract.
message CreateGuildIconUploadResponse {
  // Opaque upload identifier used by completion or abort.
  int64 upload_id = 1;
  // Short-lived URL accepting one PUT with the declared length and media type.
  string presigned_url = 2;
  // Presigned URL expiration as Unix milliseconds.
  int64 expires_at = 3;
  // HTTP headers required by the presigned PUT. Browser-managed headers such
  // as Content-Length are informational and must not be set explicitly.
  map<string, string> request_headers = 4;
  // status is the upload lifecycle state observed for this response.
  UploadStatus status = 5;
  // True when the existing idempotency record was replayed.
  bool idempotent_replay = 6;
}

// CompleteGuildIconUploadRequest selects an icon upload for one Guild.
message CompleteGuildIconUploadRequest {
  int64 guild_id = 1;
  // Opaque value returned by CreateGuildIconUpload.
  int64 upload_id = 2;
}

// CompleteGuildIconUploadResponse returns the Guild after its icon reference
// has been replaced.
message CompleteGuildIconUploadResponse {
  Guild guild = 1;
}

// AbortGuildIconUploadRequest selects an unpublished icon upload to cancel.
message AbortGuildIconUploadRequest {
  int64 guild_id = 1;
  // Opaque value returned by CreateGuildIconUpload.
  int64 upload_id = 2;
}

// AbortGuildIconUploadResponse is empty because abort has no mutable result.
message AbortGuildIconUploadResponse {}

// DeleteGuildRequest soft-deletes one Guild owned by the authenticated user.
message DeleteGuildRequest {
  // ID of the Guild to delete.
  int64 guild_id = 1;
}

// DeleteGuildResponse confirms deletion.
message DeleteGuildResponse {
  bool ok = 1;
}
