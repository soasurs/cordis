name: guild.v1
listenOn: 0.0.0.0:3005
timeout: 0
shutdownTimeout: 20s
health: false

log:
  mode: console
  level: info
  stat: false

middlewares:
  stat: false

database:
  dataSource: "${CORDIS_DATABASE_DSN}"
  maxOpenConns: 10

kafka:
  seeds:
    - kafka:29092
  topic: cordis.guild.events.v1
  userTopic: cordis.user.events.v1
  profileConsumerGroup: cordis.guild.user.profiles.v1
  rebuildProfilesOnStart: true

outbox:
  shardCount: 64

cursor:
  secret: "${CORDIS_CURSOR_SECRET}"

limits:
  ownedGuildsPerUser: 10
  joinedGuildsPerUser: 100
  rolesPerGuild: 250
  channelsPerGuild: 500
  activeInvitesPerGuild: 100
  overwritesPerChannel: 100

idempotency:
  keyMaxLength: 255
  createGuildTTLSeconds: 86400
  createGuildRoleTTLSeconds: 86400
  createGuildChannelTTLSeconds: 86400
  createGuildInviteTTLSeconds: 86400

services:
  user:
    endpoints:
      - user:3000
  media:
    endpoints:
      - media:3008
