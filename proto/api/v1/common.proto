edition = "2023";

package api.v1;

import "api/v1/user.proto";

// GuildPermission values are bit flags combined in uint64 permission fields.
enum GuildPermission {
  // No permission. Requests requiring a concrete permission reject this value.
  GUILD_PERMISSION_UNSPECIFIED = 0;
  // Grants every Guild permission and bypasses channel overwrites.
  GUILD_PERMISSION_ADMINISTRATOR = 1;
  // Allows managing Guild settings, the icon, and deletion.
  GUILD_PERMISSION_MANAGE_GUILD = 2;
  // Allows creating, editing, reordering, and deleting roles.
  GUILD_PERMISSION_MANAGE_ROLES = 4;
  // Allows managing members and their role assignments.
  GUILD_PERMISSION_MANAGE_MEMBERS = 8;
  // Allows removing members from the Guild.
  GUILD_PERMISSION_KICK_MEMBERS = 16;
  // Allows viewing a channel.
  GUILD_PERMISSION_VIEW_CHANNEL = 32;
  // Allows sending messages in a channel.
  GUILD_PERMISSION_SEND_MESSAGES = 64;
  // Allows creating, editing, deleting, and reordering channels and their
  // permission overwrites.
  GUILD_PERMISSION_MANAGE_CHANNELS = 128;
  // Allows editing and deleting other members' messages.
  GUILD_PERMISSION_MANAGE_MESSAGES = 256;
  // Allows banning and unbanning members.
  GUILD_PERMISSION_BAN_MEMBERS = 512;
  // Allows creating Guild invites.
  GUILD_PERMISSION_CREATE_INVITE = 1024;
  // Allows the message author to mention roles and @everyone in a channel.
  GUILD_PERMISSION_MENTION_EVERYONE = 2048;
}

// GuildChannelType identifies the behavior and nesting rules of a channel.
enum GuildChannelType {
  // No channel type. This value is invalid when creating a channel.
  GUILD_CHANNEL_TYPE_UNSPECIFIED = 0;
  // A channel that stores messages.
  GUILD_CHANNEL_TYPE_TEXT = 1;
  // A container for non-category channels.
  GUILD_CHANNEL_TYPE_CATEGORY = 2;
  // A realtime voice channel.
  GUILD_CHANNEL_TYPE_VOICE = 3;
}

// GuildPermissionOverwriteType selects whether an overwrite applies to a role
// or one member.
enum GuildPermissionOverwriteType {
  // No applies_to. This value is invalid in overwrite requests.
  GUILD_PERMISSION_OVERWRITE_TYPE_UNSPECIFIED = 0;
  // The overwrite applies to one role.
  GUILD_PERMISSION_OVERWRITE_TYPE_ROLE = 1;
  // The overwrite applies to one member.
  GUILD_PERMISSION_OVERWRITE_TYPE_MEMBER = 2;
}

// ============================================================

// Guild is a community the authenticated user belongs to.
// All timestamps are Unix time in milliseconds.
message Guild {
  int64 id = 1;
  int64 owner_id = 2;
  string name = 3;
  // Zero means the Guild has no icon. Clients resolve a non-zero value through
  // the public CDN path icons/{id}/{icon_asset_id}.
  int64 icon_asset_id = 4;
  // Monotonically increasing resource version used to discard stale events.
  int64 revision = 5;
  int64 created_at = 6;
  int64 updated_at = 7;
  // Optional Guild description. Empty means no description.
  string description = 8;
}

// GuildMember is a user's membership in one guild.
// All timestamps are Unix time in milliseconds.
message GuildMember {
  int64 guild_id = 1;
  int64 user_id = 2;
  string nickname = 3;
  // Monotonically increasing membership version.
  int64 revision = 4;
  int64 joined_at = 5;
  int64 updated_at = 6;
  // Current public profile of this member.
  UserProfile profile = 7;
}

// GuildBan records an active Guild ban and the moderator who created it.
// created_at is Unix time in milliseconds.
message GuildBan {
  int64 guild_id = 1;
  int64 user_id = 2;
  int64 actor_user_id = 3;
  // Optional reason recorded with the ban.
  string reason = 4;
  int64 created_at = 5;
  // Current public profile of the banned user.
  UserProfile profile = 6;
  // Current public profile of the moderator who created the ban.
  UserProfile actor_profile = 7;
}

// GuildRole grants guild-level permissions to assigned members.
// All timestamps are Unix time in milliseconds.
message GuildRole {
  int64 id = 1;
  int64 guild_id = 2;
  string name = 3;
  // Bitwise OR of GuildPermission values.
  uint64 permissions = 4;
  // Higher values have greater authority. The default role is always at zero.
  int32 position = 5;
  // The default role has the same ID as its Guild and applies implicitly to
  // every active member.
  bool is_default = 6;
  // Monotonically increasing resource version.
  int64 revision = 7;
  int64 created_at = 8;
  int64 updated_at = 9;
}

// GuildMentionUser is a search result preview for a member that can be
// mentioned.
message GuildMentionUser {
  // ID of the mentionable member.
  int64 user_id = 1;
  // Username of the member.
  string username = 2;
  // Display name of the member.
  string name = 3;
  // Zero means the member has no avatar.
  int64 avatar_asset_id = 4;
  // Guild nickname of the member, empty when unset.
  string nickname = 5;
}

// SearchGuildMentionUsersRequest prefix-searches mentionable members visible
// in one channel.
message SearchGuildMentionUsersRequest {
  // Guild to search.
  int64 guild_id = 1;
  // Zero uses the default; the maximum is 20.
  int32 limit = 2;
  // Prefix query matched against username, nickname, and profile name.
  string query = 3;
  // Only members that can view this channel are returned.
  int64 channel_id = 4;
}

// SearchGuildMentionUsersResponse returns the matching mention candidates.
message SearchGuildMentionUsersResponse {
  repeated GuildMentionUser users = 1;
}

// SearchGuildMentionRolesRequest prefix-searches the roles of one Guild.
message SearchGuildMentionRolesRequest {
  // Guild to search.
  int64 guild_id = 1;
  // Zero uses the default; the maximum is 20.
  int32 limit = 2;
  // Prefix query matched against role name.
  string query = 3;
}

// SearchGuildMentionRolesResponse returns the matching roles.
message SearchGuildMentionRolesResponse {
  repeated GuildRole roles = 1;
}

// GuildChannel is a text, category, or voice channel within one Guild.
// All timestamps are Unix time in milliseconds.
message GuildChannel {
  int64 id = 1;
  int64 guild_id = 2;
  string name = 3;
  GuildChannelType type = 4;
  // Zero-based position within the parent.
  int32 position = 5;
  // Optional channel topic.
  string topic = 6;
  // Monotonically increasing resource version.
  int64 revision = 7;
  int64 created_at = 8;
  int64 updated_at = 9;
  // Parent category ID, or zero when the channel is at the Guild root.
  int64 parent_id = 10;
}

// GuildChannelPermissionOverwrite adjusts a role or member's permissions in a
// channel. Evaluation applies the default role, assigned roles, then the member.
message GuildChannelPermissionOverwrite {
  int64 channel_id = 1;
  int64 guild_id = 2;
  // Whether this overwrite applies to a role or a member.
  GuildPermissionOverwriteType applies_to = 3;
  // Role ID or user ID according to applies_to.
  int64 applies_to_id = 4;
  // Permission bits granted in this channel.
  uint64 allow = 5;
  // Permission bits denied in this channel.
  uint64 deny = 6;
  // Monotonically increasing resource version.
  int64 revision = 7;
  int64 created_at = 8;
  int64 updated_at = 9;
}
