edition = "2023";

package api.v1;

import "api/v1/media.proto";

// UserService exposes public account and profile operations.
service UserService {
  // GetCurrentUser returns the private account and profile for the bearer token owner.
  rpc GetCurrentUser(GetCurrentUserRequest) returns (GetCurrentUserResponse);
  // GetUserProfile returns another user's public profile.
  rpc GetUserProfile(GetUserProfileRequest) returns (GetUserProfileResponse);
  // CheckEmailAvailability supports registration flows without requiring authentication.
  rpc CheckEmailAvailability(CheckEmailAvailabilityRequest) returns (CheckEmailAvailabilityResponse);
  // CheckUsernameAvailability supports registration and profile flows without
  // requiring authentication. Invalid usernames are rejected; taken handles
  // return available=false.
  rpc CheckUsernameAvailability(CheckUsernameAvailabilityRequest) returns (CheckUsernameAvailabilityResponse);
  // GetAvatarUploadConstraints returns the current avatar direct-upload limits
  // without requiring authentication.
  rpc GetAvatarUploadConstraints(GetAvatarUploadConstraintsRequest) returns (GetAvatarUploadConstraintsResponse);
  // UpdateEmail changes the bearer token owner's email address.
  rpc UpdateEmail(UpdateEmailRequest) returns (UpdateEmailResponse);
  // UpdateUserProfile replaces the bearer token owner's public profile fields.
  rpc UpdateUserProfile(UpdateUserProfileRequest) returns (UpdateUserProfileResponse);
  // CreateAvatarUpload creates a single-PUT avatar upload owned by the bearer
  // token user.
  rpc CreateAvatarUpload(CreateAvatarUploadRequest) returns (CreateAvatarUploadResponse);
  // CompleteAvatarUpload validates the uploaded image and replaces the bearer
  // token user's avatar reference.
  rpc CompleteAvatarUpload(CompleteAvatarUploadRequest) returns (CompleteAvatarUploadResponse);
  // AbortAvatarUpload cancels an unpublished upload owned by the bearer token
  // user.
  rpc AbortAvatarUpload(AbortAvatarUploadRequest) returns (AbortAvatarUploadResponse);
  // ChangePassword changes the bearer token owner's password after verifying the old password.
  // A successful change revokes every other session owned by the user.
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);
  // LookupUser resolves a username to a public profile.
  rpc LookupUser(LookupUserRequest) returns (LookupUserResponse);
  // UpdateUsername replaces the bearer token owner's unique handle; the old
  // handle is released immediately.
  rpc UpdateUsername(UpdateUsernameRequest) returns (UpdateUsernameResponse);
  // SendFriendRequest sends a friend request to one user.
  rpc SendFriendRequest(SendFriendRequestRequest) returns (SendFriendRequestResponse);
  // AcceptFriendRequest accepts a pending incoming friend request.
  rpc AcceptFriendRequest(AcceptFriendRequestRequest) returns (AcceptFriendRequestResponse);
  // DeclineFriendRequest declines a pending incoming friend request.
  rpc DeclineFriendRequest(DeclineFriendRequestRequest) returns (DeclineFriendRequestResponse);
  // RemoveFriend deletes a friendship or retracts a pending request in
  // either direction.
  rpc RemoveFriend(RemoveFriendRequest) returns (RemoveFriendResponse);
  // BlockUser blocks one user and hides them from the caller.
  rpc BlockUser(BlockUserRequest) returns (BlockUserResponse);
  // UnblockUser lifts a previous block.
  rpc UnblockUser(UnblockUserRequest) returns (UnblockUserResponse);
  // ListRelationships pages the caller's relationships.
  rpc ListRelationships(ListRelationshipsRequest) returns (ListRelationshipsResponse);
}

// User contains private account fields and is only returned to the account owner.
// All timestamps are Unix time in milliseconds.
message User {
  int64 user_id = 1;
  string email = 2;
  int64 created_at = 3;
  int64 updated_at = 4;
  // Zero when the current email has not been verified.
  int64 email_verified_at = 5;
}

// UserProfile contains fields safe to expose to other users.
// All timestamps are Unix time in milliseconds.
message UserProfile {
  int64 user_id = 1;
  string name = 2;
  // Zero means the user has no avatar. Clients resolve a non-zero value through
  // the public CDN path avatars/{user_id}/{avatar_asset_id}.
  int64 avatar_asset_id = 3;
  int64 created_at = 4;
  int64 updated_at = 5;
  // Globally unique lowercase handle.
  string username = 6;
  // Public about text. Empty means the user has no bio. Limited to 190 Unicode
  // code points.
  string bio = 7;
}

// The current user is derived from the Authorization bearer token.
message GetCurrentUserRequest {}

// GetCurrentUserResponse returns the private account and public profile.
message GetCurrentUserResponse {
  User user = 1;
  UserProfile profile = 2;
}

// GetUserProfileRequest fetches another user's public profile.
message GetUserProfileRequest {
  // User whose public profile is fetched.
  int64 user_id = 1;
}

// GetUserProfileResponse returns the requested public profile.
message GetUserProfileResponse {
  UserProfile profile = 1;
}

// CheckEmailAvailabilityRequest checks whether an email can still register.
message CheckEmailAvailabilityRequest {
  // Email address to check.
  string email = 1;
}

// CheckEmailAvailabilityResponse reports whether the email is free.
message CheckEmailAvailabilityResponse {
  // True when the email is not already registered.
  bool available = 1;
}

// CheckUsernameAvailabilityRequest checks whether a handle is available.
message CheckUsernameAvailabilityRequest {
  // Handle to check.
  string username = 1;
}

// CheckUsernameAvailabilityResponse reports whether the handle is free.
message CheckUsernameAvailabilityResponse {
  // True when the handle is valid and not taken.
  bool available = 1;
}

// GetAvatarUploadConstraintsRequest is empty; constraints are global.
message GetAvatarUploadConstraintsRequest {}

// AvatarUploadConstraints describes the current avatar direct-upload limits.
message AvatarUploadConstraints {
  // Maximum accepted avatar file size in bytes.
  int64 max_file_size_bytes = 1;
  // Maximum accepted width in pixels.
  int32 max_width = 2;
  // Maximum accepted height in pixels.
  int32 max_height = 3;
  // Maximum accepted width * height product.
  int64 max_pixels = 4;
  // Canonical lowercase MIME types accepted for avatar uploads.
  repeated string allowed_content_types = 5;
}

// GetAvatarUploadConstraintsResponse returns the avatar upload limits.
message GetAvatarUploadConstraintsResponse {
  AvatarUploadConstraints constraints = 1;
}

// UpdateEmailRequest changes the bearer token owner's email address.
message UpdateEmailRequest {
  // New email address. Verification is required before it becomes active.
  string email = 1;
}

// UpdateEmailResponse returns the updated account.
message UpdateEmailResponse {
  User user = 1;
}

// UpdateUserProfileRequest replaces present public profile fields of the
// bearer token owner.
message UpdateUserProfileRequest {
  // Optional replacement fields. Omitted fields keep their stored values.
  // An explicitly present empty bio clears the bio. An explicitly present
  // avatar_asset_id of 0 clears the avatar; a non-zero value mounts an owned
  // user-avatar Media asset (completing the upload when still unpublished).
  // At least one mutable field must be present.
  string name = 1;
  string bio = 2;
  int64 avatar_asset_id = 3;
}

// UpdateUserProfileResponse returns the updated public profile.
message UpdateUserProfileResponse {
  UserProfile profile = 1;
}

// CreateAvatarUploadRequest declares the exact image the client will upload.
message CreateAvatarUploadRequest {
  // Exact Content-Length in bytes for the subsequent PUT.
  int64 expected_size = 1;
  // Canonical image/jpeg, image/png, or image/webp media type. The same value
  // must be sent as the PUT Content-Type.
  string content_type = 2;
  // Optional opaque key identifying one client-side avatar upload intent.
  // Retrying with the same key returns the same upload.
  string idempotency_key = 3;
}

// CreateAvatarUploadResponse contains a one-shot direct-upload contract.
message CreateAvatarUploadResponse {
  // Opaque upload identifier used by CompleteAvatarUpload, AbortAvatarUpload,
  // or UpdateUserProfile.avatar_asset_id.
  int64 upload_id = 1;
  // Short-lived URL accepting one PUT with the declared length and media type.
  string presigned_url = 2;
  // Presigned URL expiration as Unix milliseconds.
  int64 expires_at = 3;
  // HTTP headers required by the presigned PUT. Browser-managed headers such
  // as Content-Length are informational and must not be set explicitly.
  map<string, string> request_headers = 4;
  // status is the upload lifecycle state observed for this response.
  UploadStatus status = 5;
  // True when the existing idempotency record was replayed.
  bool idempotent_replay = 6;
}

// CompleteAvatarUploadRequest selects a previously created avatar upload.
message CompleteAvatarUploadRequest {
  int64 upload_id = 1;
}

// CompleteAvatarUploadResponse returns the profile after its avatar reference
// has been replaced.
message CompleteAvatarUploadResponse {
  UserProfile profile = 1;
}

// AbortAvatarUploadRequest selects an unpublished avatar upload to cancel.
message AbortAvatarUploadRequest {
  int64 upload_id = 1;
}

// AbortAvatarUploadResponse is empty because abort has no mutable result.
message AbortAvatarUploadResponse {}

// ChangePasswordRequest changes the bearer token owner's password after
// verifying the old one.
message ChangePasswordRequest {
  // Current password used to verify the account owner.
  string old_password = 1;
  // Replacement password.
  string new_password = 2;
}

// ChangePasswordResponse confirms the password change.
message ChangePasswordResponse {
  bool ok = 1;
}

// RelationshipType mirrors user.v1.RelationshipType.
enum RelationshipType {
  // Zero value; no relationship exists.
  RELATIONSHIP_TYPE_UNSPECIFIED = 0;
  // The caller sent a friend request that is still pending.
  RELATIONSHIP_TYPE_OUTGOING = 1;
  // The caller received a friend request that is still pending.
  RELATIONSHIP_TYPE_INCOMING = 2;
  // The caller and target are friends.
  RELATIONSHIP_TYPE_FRIEND = 3;
  // The caller blocked the target.
  RELATIONSHIP_TYPE_BLOCKED = 4;
}

// Relationship is the caller's view of their link to another user.
// All timestamps are Unix time in milliseconds.
message Relationship {
  int64 target_id = 1;
  RelationshipType type = 2;
  int64 created_at = 3;
  int64 updated_at = 4;
  // Current public profile of the target user.
  UserProfile profile = 5;
}

// LookupUserRequest resolves one handle to a public profile.
message LookupUserRequest {
  // Handle to resolve.
  string username = 1;
}

// LookupUserResponse returns the profile behind the handle.
message LookupUserResponse {
  UserProfile profile = 1;
}

// SendFriendRequestRequest sends a friend request to one user.
message SendFriendRequestRequest {
  // User to send the request to.
  int64 target_id = 1;
}

// SendFriendRequestResponse returns the resulting relationship.
message SendFriendRequestResponse {
  // Outgoing after a fresh request, or friend when the target had already
  // sent a request the other way.
  Relationship relationship = 1;
}

// AcceptFriendRequestRequest accepts a pending incoming friend request.
message AcceptFriendRequestRequest {
  // User whose incoming request is accepted.
  int64 target_id = 1;
}

// AcceptFriendRequestResponse returns the updated relationship.
message AcceptFriendRequestResponse {
  Relationship relationship = 1;
}

// DeclineFriendRequestRequest declines a pending incoming friend request.
message DeclineFriendRequestRequest {
  // User whose incoming request is declined.
  int64 target_id = 1;
}

// DeclineFriendRequestResponse confirms the decline.
message DeclineFriendRequestResponse {
  bool ok = 1;
}

// RemoveFriendRequest removes a friendship or retracts a pending request.
message RemoveFriendRequest {
  // User to disconnect from.
  int64 target_id = 1;
}

// RemoveFriendResponse confirms removal.
message RemoveFriendResponse {
  bool ok = 1;
}

// BlockUserRequest blocks one user.
message BlockUserRequest {
  // User to block.
  int64 target_id = 1;
}

// BlockUserResponse returns the blocking relationship.
message BlockUserResponse {
  Relationship relationship = 1;
}

// UnblockUserRequest unblocks one user.
message UnblockUserRequest {
  // User to unblock.
  int64 target_id = 1;
}

// UnblockUserResponse confirms unblocking.
message UnblockUserResponse {
  bool ok = 1;
}

// ListRelationshipsRequest pages the caller's relationships.
message ListRelationshipsRequest {
  // Optional filter; unspecified returns every type.
  RelationshipType type = 1;
  // Opaque continuation from ListRelationshipsResponse.next_cursor.
  // Omit (unset) to start from the first page. Pass the value through
  // unchanged; do not parse it.
  string cursor = 2;
  // Maximum results per page. Zero uses the default of 50; maximum is 100.
  int32 limit = 3;
}

// ListRelationshipsResponse returns a page of relationships.
message ListRelationshipsResponse {
  repeated Relationship relationships = 1;
  // Opaque cursor for the next page. Leave unset when there is no next
  // page; do not set an empty string. Pass through unchanged as the next
  // request's cursor. End of list is field absence (Go: !HasNextCursor();
  // TypeScript: undefined / omitted from JSON, not null).
  string next_cursor = 2;
}

// UpdateUsernameRequest replaces the bearer token owner's handle.
message UpdateUsernameRequest {
  // New globally unique lowercase handle.
  string username = 1;
}

// UpdateUsernameResponse returns the updated public profile.
message UpdateUsernameResponse {
  UserProfile profile = 1;
}
