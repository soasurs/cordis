name: message.v1
listenOn: 0.0.0.0:3002
timeout: 0
shutdownTimeout: 20s
health: false

log:
  level: error
  stat: false

devServer:
  enabled: true
  host: 0.0.0.0
  port: 6063
  enableMetrics: true
  enablePprof: false

telemetry:
  endpoint: "${CORDIS_OTEL_ENDPOINT}"
  sampler: 1.0
  batcher: otlpgrpc

middlewares:
  trace: true
  recover: true
  stat: false
  prometheus: true
  breaker: true

database:
  dataSource: postgres://cordis:cordis@127.0.0.1:5432/cordis?sslmode=disable
  maxOpenConns: 10

kafka:
  seeds: []
  topic: cordis.message.events.v1

cursor:
  secret: "${CORDIS_CURSOR_SECRET}"

readStates:
  maxConcurrentChannels: 800

limits:
  attachmentsPerMessage: 10
  mentionsPerMessage: 100

idempotency:
  keyMaxLength: 255
  createMessageTTLSeconds: 1800

outbox:
  messageShardCount: 64
  readStateShardCount: 64

services:
  guild:
    endpoints:
      - 127.0.0.1:3005
    middlewares:
      trace: true
      duration: false
      prometheus: true
      breaker: true
      timeout: true
  user:
    endpoints:
      - 127.0.0.1:3000
    middlewares:
      trace: true
      duration: false
      prometheus: true
      breaker: true
      timeout: true
  media:
    endpoints:
      - 127.0.0.1:3008
    middlewares:
      trace: true
      duration: false
      prometheus: true
      breaker: true
      timeout: true
