edition = "2023";

package api.v1;

import "api/v1/channels.proto";
import "api/v1/common.proto";
import "api/v1/invites.proto";
import "api/v1/lifecycle.proto";
import "api/v1/members.proto";
import "api/v1/roles.proto";

// GuildService exposes authenticated guild metadata operations.
service GuildService {
  // Guild lifecycle.
  rpc CreateGuild(CreateGuildRequest) returns (CreateGuildResponse);
  // GetGuild returns one Guild joined by the bearer token user.
  rpc GetGuild(GetGuildRequest) returns (GetGuildResponse);
  // ListGuilds returns Guilds joined by the bearer token user.
  rpc ListGuilds(ListGuildsRequest) returns (ListGuildsResponse);
  // UpdateGuild applies present metadata changes to one Guild owned by the
  // bearer token user.
  rpc UpdateGuild(UpdateGuildRequest) returns (UpdateGuildResponse);
  // CreateGuildIconUpload creates a single-PUT icon upload after checking the
  // bearer token user's MANAGE_GUILD permission.
  rpc CreateGuildIconUpload(CreateGuildIconUploadRequest) returns (CreateGuildIconUploadResponse);
  // CompleteGuildIconUpload validates the image and replaces the Guild icon.
  rpc CompleteGuildIconUpload(CompleteGuildIconUploadRequest) returns (CompleteGuildIconUploadResponse);
  // AbortGuildIconUpload cancels an unpublished icon upload.
  rpc AbortGuildIconUpload(AbortGuildIconUploadRequest) returns (AbortGuildIconUploadResponse);
  // DeleteGuild soft-deletes one Guild owned by the bearer token user.
  rpc DeleteGuild(DeleteGuildRequest) returns (DeleteGuildResponse);

  // Membership and moderation.
  // AddGuildMember adds an existing user to one Guild.
  rpc AddGuildMember(AddGuildMemberRequest) returns (AddGuildMemberResponse);
  // GetGuildMember returns one Guild membership.
  rpc GetGuildMember(GetGuildMemberRequest) returns (GetGuildMemberResponse);
  // ListGuildMembers pages the members of one Guild.
  rpc ListGuildMembers(ListGuildMembersRequest) returns (ListGuildMembersResponse);
  // UpdateCurrentGuildMember updates the caller's own Guild nickname.
  rpc UpdateCurrentGuildMember(UpdateCurrentGuildMemberRequest) returns (UpdateCurrentGuildMemberResponse);
  // KickGuildMember removes one member from one Guild.
  rpc KickGuildMember(KickGuildMemberRequest) returns (KickGuildMemberResponse);
  // BanGuildMember bans one member and records the reason.
  rpc BanGuildMember(BanGuildMemberRequest) returns (BanGuildMemberResponse);
  // UnbanGuildMember lifts one member's ban.
  rpc UnbanGuildMember(UnbanGuildMemberRequest) returns (UnbanGuildMemberResponse);
  // ListGuildBans pages the active bans of one Guild.
  rpc ListGuildBans(ListGuildBansRequest) returns (ListGuildBansResponse);
  // LeaveGuild removes the caller from one Guild.
  rpc LeaveGuild(LeaveGuildRequest) returns (LeaveGuildResponse);
  // TransferGuildOwnership transfers one Guild to another member.
  rpc TransferGuildOwnership(TransferGuildOwnershipRequest) returns (TransferGuildOwnershipResponse);

  // Invites.
  // CreateGuildInvite creates a shareable invite for one Guild.
  rpc CreateGuildInvite(CreateGuildInviteRequest) returns (CreateGuildInviteResponse);
  // GetGuildInvite returns a public preview and does not require membership.
  rpc GetGuildInvite(GetGuildInviteRequest) returns (GetGuildInviteResponse);
  // ListGuildInvites pages the invites of one Guild.
  rpc ListGuildInvites(ListGuildInvitesRequest) returns (ListGuildInvitesResponse);
  // DeleteGuildInvite removes one invite.
  rpc DeleteGuildInvite(DeleteGuildInviteRequest) returns (DeleteGuildInviteResponse);
  // JoinGuildByInvite joins the caller to the Guild behind a code.
  rpc JoinGuildByInvite(JoinGuildByInviteRequest) returns (JoinGuildByInviteResponse);

  // Roles and effective Guild permissions.
  // CreateGuildRole creates a non-default role with the requested
  // permissions.
  rpc CreateGuildRole(CreateGuildRoleRequest) returns (CreateGuildRoleResponse);
  // GetGuildRole returns one role.
  rpc GetGuildRole(GetGuildRoleRequest) returns (GetGuildRoleResponse);
  // ListGuildRoles returns the roles of one Guild in position order.
  rpc ListGuildRoles(ListGuildRolesRequest) returns (ListGuildRolesResponse);
  // UpdateGuildRole applies present name or permission changes to one role.
  rpc UpdateGuildRole(UpdateGuildRoleRequest) returns (UpdateGuildRoleResponse);
  // DeleteGuildRole rejects the default @everyone role.
  rpc DeleteGuildRole(DeleteGuildRoleRequest) returns (DeleteGuildRoleResponse);
  // ReorderGuildRoles atomically applies new positions to a partial set of
  // roles.
  rpc ReorderGuildRoles(ReorderGuildRolesRequest) returns (ReorderGuildRolesResponse);
  // AddGuildMemberRole assigns one role to one member.
  rpc AddGuildMemberRole(AddGuildMemberRoleRequest) returns (AddGuildMemberRoleResponse);
  // RemoveGuildMemberRole removes one role assignment.
  rpc RemoveGuildMemberRole(RemoveGuildMemberRoleRequest) returns (RemoveGuildMemberRoleResponse);
  // AddGuildRoleMembers assigns one non-default role to many members.
  rpc AddGuildRoleMembers(AddGuildRoleMembersRequest) returns (AddGuildRoleMembersResponse);
  // RemoveGuildRoleMembers removes one non-default role from many members.
  rpc RemoveGuildRoleMembers(RemoveGuildRoleMembersRequest) returns (RemoveGuildRoleMembersResponse);
  // ListGuildMemberRoles includes the implicit default role.
  rpc ListGuildMemberRoles(ListGuildMemberRolesRequest) returns (ListGuildMemberRolesResponse);
  // ListGuildRoleMembers returns explicitly assigned members, or every member
  // when role_id identifies the default role.
  rpc ListGuildRoleMembers(ListGuildRoleMembersRequest) returns (ListGuildRoleMembersResponse);
  // GetGuildMemberPermissions returns a member's effective Guild-level
  // permissions.
  rpc GetGuildMemberPermissions(GetGuildMemberPermissionsRequest) returns (GetGuildMemberPermissionsResponse);
  // SearchGuildMentionUsers performs a prefix search against usernames,
  // nicknames, and profile names visible in the requested channel.
  rpc SearchGuildMentionUsers(SearchGuildMentionUsersRequest) returns (SearchGuildMentionUsersResponse);
  // SearchGuildMentionRoles performs a prefix search against Guild role names.
  rpc SearchGuildMentionRoles(SearchGuildMentionRolesRequest) returns (SearchGuildMentionRolesResponse);

  // Channels and permission overwrites.
  // CreateGuildChannel creates a text, category, or voice channel in one
  // Guild.
  rpc CreateGuildChannel(CreateGuildChannelRequest) returns (CreateGuildChannelResponse);
  // GetGuildChannel returns one channel when the caller can view it.
  rpc GetGuildChannel(GetGuildChannelRequest) returns (GetGuildChannelResponse);
  // ListGuildChannels returns the channels visible to the caller and the
  // current layout revision.
  rpc ListGuildChannels(ListGuildChannelsRequest) returns (ListGuildChannelsResponse);
  // UpdateGuildChannel applies present name, topic, or parent changes to one
  // channel.
  rpc UpdateGuildChannel(UpdateGuildChannelRequest) returns (UpdateGuildChannelResponse);
  // DeleteGuildChannel deletes one channel and returns the new layout
  // revision.
  rpc DeleteGuildChannel(DeleteGuildChannelRequest) returns (DeleteGuildChannelResponse);
  // ReorderGuildChannels atomically moves channels to new positions.
  rpc ReorderGuildChannels(ReorderGuildChannelsRequest) returns (ReorderGuildChannelsResponse);
  // UpsertGuildChannelPermissionOverwrite creates or replaces one channel
  // permission overwrite.
  rpc UpsertGuildChannelPermissionOverwrite(UpsertGuildChannelPermissionOverwriteRequest) returns (UpsertGuildChannelPermissionOverwriteResponse);
  // DeleteGuildChannelPermissionOverwrite rejects the default @everyone overwrite.
  rpc DeleteGuildChannelPermissionOverwrite(DeleteGuildChannelPermissionOverwriteRequest) returns (DeleteGuildChannelPermissionOverwriteResponse);
  // ListGuildChannelPermissionOverwrites lists the overwrites of one channel.
  rpc ListGuildChannelPermissionOverwrites(ListGuildChannelPermissionOverwritesRequest) returns (ListGuildChannelPermissionOverwritesResponse);
}
