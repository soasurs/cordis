edition = "2023";

package api.v1;

// PresenceService exposes privacy-filtered aggregate Presence snapshots.
service PresenceService {
  // ResolveUsersPresence returns visible snapshots for at most 100 unique
  // users. Targets without a self, friend, or common-Guild relationship are
  // omitted.
  rpc ResolveUsersPresence(ResolveUsersPresenceRequest) returns (ResolveUsersPresenceResponse);
}

// PresenceStatus is the privacy-filtered aggregate status exposed to other
// users.
enum PresenceStatus {
  // Zero value; not used in responses.
  PRESENCE_STATUS_UNSPECIFIED = 0;
  // The user is offline or hidden.
  PRESENCE_STATUS_OFFLINE = 1;
  // The user is online.
  PRESENCE_STATUS_ONLINE = 2;
  // The user is online but idle.
  PRESENCE_STATUS_IDLE = 3;
  // The user is online but does not want to be disturbed.
  PRESENCE_STATUS_DND = 4;
}

// Presence is one user's aggregate status snapshot.
message Presence {
  // User of the snapshot.
  int64 user_id = 1;
  // Aggregate status visible to the caller.
  PresenceStatus status = 2;
  // Unix milliseconds of the last seen activity.
  int64 last_seen_at = 3;
  // Monotonically increasing snapshot version.
  int64 version = 4;
}

// ResolveUsersPresenceRequest requests snapshots for up to 100 unique users.
message ResolveUsersPresenceRequest {
  // Users whose visible presence is resolved.
  repeated int64 user_ids = 1;
}

// ResolveUsersPresenceResponse returns snapshots for users visible to the
// caller; invisible targets are omitted.
message ResolveUsersPresenceResponse {
  repeated Presence presences = 1;
}
